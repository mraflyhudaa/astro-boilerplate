services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://example.com}
    ports:
      - '4321:4321'
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-4321}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4321/api/health/']
      start_period: 10s
      interval: 30s
      timeout: 3s
      retries: 3
